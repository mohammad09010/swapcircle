services:
  db:
    image: mysql:8.0
    container_name: swapcircle-db
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --innodb-redo-log-capacity=64M
      - --max-connections=50
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: swapcircle
      MYSQL_USER: swapuser
      MYSQL_PASSWORD: swappass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build: .
    container_name: swapcircle-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: swapuser
      DB_PASSWORD: swappass
      DB_NAME: swapcircle
      SESSION_SECRET: ${SESSION_SECRET:-swapcircle-dev-secret-please-change}
    ports:
      - "3002:3000"

volumes:
  db_data:
